[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slideshift"
version = "0.1.0"
description = "A Pathology Whole-Slide Foundation Model & MIL Pipeline with Robustness Benchmarking and Shift Monitoring"
readme = "README.md"
authors = [{ name = "SlideShift Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "computational-pathology",
    "whole-slide-images",
    "foundation-models",
    "multiple-instance-learning",
    "domain-shift",
    "out-of-distribution-detection",
    "explainable-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "pillow>=9.5.0",
    "tifffile>=2023.4.12",
    "h5py>=3.8.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "transformers>=4.35.0",
]
wsi = [
    "openslide-python>=1.3.0",
]
demo = [
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.1.0",
]
all = [
    "slideshift[torch,wsi,demo,dev]",
]

[project.scripts]
slideshift = "slideshift.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slideshift*"]

